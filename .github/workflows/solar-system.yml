    docker:
      name: docker
      runs-on: ubuntu-latest
      steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # - name: Unit Testing
      #   run: npm test



    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      environment: 
        name: development
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Azure Install
          uses: azure/setup-kubectl@v4
          with:
            version: 'v1.26.0' # default is latest stable
          id: install
        - name: azure/k8s-set-context
          uses: azure/k8s-set-context@v4
          with:
             method: kubeconfig
             kubeconfig: ${{secrets.KUBECONFIG}}
        - name: Run
          run: kubectl version --short -o yaml
          continue-on-error: true

        - name: NGINX INGRESS CONTROLLER IP
          run: echo 'INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV >> $GITHUB_ENV
      
        - uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: '${{ vars.NAMESPACE }}'
            REPLICAS: '${{ vars.REPLICAS }}'
            IMAGE: >-
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha
              }}
            INGRESS_IP: '${{ env.INGRESS_IP }}'
        - run: cat kubernetes/development/*.yaml